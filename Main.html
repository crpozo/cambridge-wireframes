<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Wireframes Plataforma Cambridge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wf-bar"><a href="index.html">← Mapa de pantallas</a><span>Login</span><span class="wf-tag">WIREFRAME · alto nivel</span></div>
<div style="min-height:820px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;color:#1f2937;background:#f3f4f6">
<form style="width:100%;max-width:420px;background:#fff;border:2px solid #1f2937;padding:40px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box">
  <div style="width:100%;height:64px;box-sizing:border-box;border:2px dashed #9ca3af;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:14px;text-align:center;padding:8px;">Logo Cambridge</div>
  <h1 style="margin:0;font-size:22px">Ingresar</h1>
  <label for="email" style="font-size:13px;font-weight:600">Correo</label>
  <input id="email" type="email" placeholder="nombre@cambridge.edu.ec" style="min-height:44px;padding:0 12px;border:2px solid #9ca3af;font-size:14px">
  <label for="pass" style="font-size:13px;font-weight:600">Contraseña</label>
  <input id="pass" type="password" placeholder="••••••••" style="min-height:44px;padding:0 12px;border:2px solid #9ca3af;font-size:14px">
  <a href="Home.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:2px solid #1f2937;font-size:14px;font-weight:600;text-decoration:none;box-sizing:border-box;background:#1f2937;color:#fff;">Ingresar</a>
  <a href="#recuperar" style="font-size:13px;text-align:center">Olvidé mi contraseña</a>
  <p style="margin:0;font-size:12px;color:#6b7280;text-align:center">2FA opcional · el rol define qué módulos y sedes se ven al entrar</p>
</form>
</div>
<script>
document.querySelectorAll('.tabs').forEach(function(bar){
  var btns=bar.querySelectorAll('[data-tab]');
  btns.forEach(function(b){
    b.addEventListener('click',function(){
      btns.forEach(function(x){var on=x===b;x.setAttribute('aria-selected',on);x.style.borderBottomColor=on?'#1f2937':'transparent';x.style.fontWeight=on?700:400;});
      var el=bar.nextElementSibling;
      while(el&&el.hasAttribute('data-panel')){el.style.display=el.getAttribute('data-panel')===b.dataset.tab?'flex':'none';el=el.nextElementSibling;}
    });
  });
});
</script>
</body>
</html>
